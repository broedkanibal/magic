<div style="flex:none;font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;color:#e7ecf4">

        Du

      </button>

    </nav>
    <button title="Ny spelare (N)" style="display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border-radius:7px;background:transparent;border:1px solid transparent;color:#93a1b6;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;flex:none" style-hover="background:#1b2230;color:#e7ecf4">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>

      <kbd style="position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;display:inline-block;min-width:17px;text-align:center;padding:1px 5px;border-radius:4px;background:#212a38;border:1px solid #333e50;border-bottom-width:2px;font:11px/1.5 ui-monospace,Menlo,monospace;color:#b9c6d8">/</kbd>

      <button style="width:24px;height:22px;border-radius:4px;color:#66748a;font-size:14px;line-height:1;cursor:pointer;background:none;border:0" style-hover="background:#232c3c;color:#e7ecf4">+</button>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:9px;height:40px;padding:0 10px;background:#241c0d;border-bottom:1px solid #4a3a17;font-size:12.5px;color:#e8c98a">
    <span style="width:7px;height:7px;border-radius:50%;background:#f0a52a;flex:none"></span>
    <span style="flex:none"><b style="color:#ffd98a">3</b> av 8 kort behöver fyllas i</span>
    <div style="display:flex;gap:4px;flex:1;min-width:0;overflow:hidden">
      <img src="https://api.scryfall.com/cards/named?exact=Swamp&format=image&version=small" alt="" style="height:30px;border-radius:3px;border:1px solid #6a5220;flex:none;background:#0b0f15">
      <img src="https://api.scryfall.com/cards/named?exact=Bonecaller+Cleric&format=image&version=small" alt="" style="height:30px;border-radius:3px;border:1px solid #6a5220;flex:none;background:#0b0f15">
      <img src="https://api.scryfall.com/cards/named?exact=Island&format=image&version=small" alt="" style="height:30px;border-radius:3px;border:1px solid #6a5220;flex:none;background:#0b0f15">
    </div>
    <button style="height:26px;padding:0 9px;border-radius:7px;background:#f0a52a;border:1px solid #f0a52a;color:#20160a;font-size:11.5px;font-weight:650;cursor:pointer;flex:none" style-hover="background:#ffb943">Granska</button>
    <button style="height:26px;padding:0 9px;border-radius:7px;background:#1b2230;border:1px solid #28313f;color:#93a1b6;font-size:11.5px;font-weight:500;cursor:pointer;flex:none" style-hover="background:#232c3c;color:#e7ecf4;border-color:#3b485c">Släng</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9 kort · 9 land · 6 i graveyard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
