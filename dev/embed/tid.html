<!doctype html><html><head><meta charset="utf-8"><title>Embed – tid per kort</title>
<style>body{background:#0d1015;color:#e7ecf4;font:12px/1.5 ui-monospace,Menlo,monospace;padding:14px}
pre{white-space:pre-wrap;margin:2px 0}b{color:#f0a52a}</style>
</head><body><div id="log"></div>
<!-- Tid per kort i en riktig webbläsare (MES-213, del 1 steg 7): modellen körs
     med onnxruntime-web på WASM (flera trådar om sidan är cross-origin isolated
     — därför dev/embed/server.cjs) och på WebGPU. Anropas från konsolen:
       await MAT('mobileclip-s0-vision.onnx', 'wasm', 256)
       await MAT('mobileclip-s0-vision.onnx', 'webgpu', 256)
     Svar: {skapaMs, forstaMs, median, p90, forbehandlaMs, tradar, isolerad}. -->
<script src="node_modules/onnxruntime-web/dist/ort.webgpu.min.js"></script>
<script>
const log = m => { document.getElementById('log').insertAdjacentHTML('beforeend', '<pre>' + m + '</pre>'); console.log(m); };
ort.env.wasm.wasmPaths = new URL('node_modules/onnxruntime-web/dist/', location.href).href;   // måste vara absolut: filerna laddas med import()
const bild = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('bild ' + src)); i.src = src; });
const NORM = { imagenet: { m: [0.485, 0.456, 0.406], s: [0.229, 0.224, 0.225] }, ingen: { m: [0, 0, 0], s: [1, 1, 1] } };

function tensorAv(img, sida, norm) {
  const cv = document.createElement('canvas'); cv.width = sida; cv.height = sida;
  const c = cv.getContext('2d', { willReadFrequently: true }); c.imageSmoothingQuality = 'high';
  const f = 0.08 / 1.16, w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  c.drawImage(img, w * f, h * f, w * (1 - 2 * f), h * (1 - 2 * f), 0, 0, sida, sida);
  const d = c.getImageData(0, 0, sida, sida).data, n = sida * sida, t = new Float32Array(3 * n);
  for (let p = 0; p < n; p++) for (let k = 0; k < 3; k++) t[k * n + p] = (d[p * 4 + k] / 255 - norm.m[k]) / norm.s[k];
  return new ort.Tensor('float32', t, [1, 3, sida, sida]);
}

window.MAT = async function (fil, backend, sida, o) {
  o = o || {};
  const tradar = o.tradar || Math.min(4, navigator.hardwareConcurrency || 4);
  ort.env.wasm.numThreads = backend === 'wasm' ? tradar : 1;
  const t0 = performance.now();
  const s = await ort.InferenceSession.create('modeller/' + fil, { executionProviders: [backend], graphOptimizationLevel: 'all' });
  const skapaMs = performance.now() - t0;
  const norm = /mobileclip/.test(fil) ? NORM.ingen : NORM.imagenet;
  const img = await bild('riktiga/06-01-ai.jpg');
  let tf = performance.now(); let x = tensorAv(img, sida, norm); const forbehandlaMs = performance.now() - tf;
  const kor = async () => { const r = await s.run({ [s.inputNames[0]]: x }); const ut = r[s.outputNames[0]]; if (ut.getData) await ut.getData(); return ut; };
  let t1 = performance.now(); await kor(); const forstaMs = performance.now() - t1;
  for (let i = 0; i < 3; i++) await kor();
  const tider = [];
  for (let i = 0; i < (o.n || 25); i++) { x = tensorAv(img, sida, norm); const a = performance.now(); await kor(); tider.push(performance.now() - a); }
  tider.sort((a, b) => a - b);
  const svar = { fil, backend, sida, skapaMs: Math.round(skapaMs), forstaMs: Math.round(forstaMs), median: +tider[tider.length >> 1].toFixed(1), p90: +tider[Math.floor(tider.length * 0.9)].toFixed(1),
                 min: +tider[0].toFixed(1), forbehandlaMs: +forbehandlaMs.toFixed(1), tradar: backend === 'wasm' ? tradar : null, isolerad: !!self.crossOriginIsolated, gpu: !!navigator.gpu, dold: document.hidden };
  log(JSON.stringify(svar));
  try { await s.release(); } catch (e) {}
  return svar;
};
log('redo — isolerad: <b>' + !!self.crossOriginIsolated + '</b>, WebGPU: <b>' + !!navigator.gpu + '</b>, kärnor: ' + navigator.hardwareConcurrency);
</script></body></html>
