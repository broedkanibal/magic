<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>When his table is a strip</title>

<body>
<x-dc>
<helmet>
<style>

<div class="ab remsor" style="width: 1041px; height: 300px">

  <div class="rrad">
    <div class="gcap"><b>Draw</b><span>a small card slides from his library into his hand, and the strip lights up once</span></div>
    <section class="strip" style="--pc: #f0a52a">
      <div class="olist">
        <i class="bdot"></i><b>Jesper</b><span class="sep"></span>
        <span class="thumbs"><img class="othumb" src="img/forest.jpg" alt=""><img class="othumb" src="img/forest.jpg" alt=""><img class="othumb" src="img/plains.jpg" alt=""><img class="othumb" src="img/woodelves.jpg" alt=""><img class="othumb" src="img/pikemaster.jpg" alt=""></span>
        <span class="sub">7 on the table</span>
        <span class="grow"></span><kbd>2</kbd>
      </div>
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 350px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 360px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 370px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 380px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 390px; top: 12px">
      <i class="minif" style="left: 456px; top: 10px"></i>
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 458px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 458px; top: 12px; --tx: -58px; animation: miniDraw 3.4s ease-in-out infinite">
      <i class="stripglow" style="animation: stripFlash 3.4s ease-in-out infinite"></i>
    </section>
  </div>

  <div class="rrad">
    <div class="gcap"><b>Scry 2</b><span>two small cards are lifted with a blue edge, one goes back, one slides under</span></div>
    <section class="strip" style="--pc: #f0a52a">
      <div class="olist">
        <i class="bdot"></i><b>Jesper</b><span class="sep"></span>
        <span class="thumbs"><img class="othumb" src="img/forest.jpg" alt=""><img class="othumb" src="img/forest.jpg" alt=""><img class="othumb" src="img/plains.jpg" alt=""><img class="othumb" src="img/woodelves.jpg" alt=""><img class="othumb" src="img/pikemaster.jpg" alt=""></span>
        <span class="sub">7 on the table</span>
        <span class="grow"></span><kbd>2</kbd>
      </div>
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 350px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 360px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 370px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 380px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 390px; top: 12px">
      <i class="minif" style="left: 456px; top: 10px"></i>
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 458px; top: 12px; animation: miniScryB 6s ease-in-out infinite">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 458px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 458px; top: 12px; animation: miniScryA 6s ease-in-out infinite">
      <i class="stripglow" style="animation: stripFlash 6s ease-in-out infinite"></i>
    </section>
  </div>

  <div class="rrad">
    <div class="gcap"><b>Search</b><span>the small library opens into a fan and closes again</span></div>
    <section class="strip" style="--pc: #f0a52a">
      <div class="olist">
        <i class="bdot"></i><b>Jesper</b><span class="sep"></span>
        <span class="thumbs"><img class="othumb" src="img/forest.jpg" alt=""><img class="othumb" src="img/forest.jpg" alt=""><img class="othumb" src="img/plains.jpg" alt=""><img class="othumb" src="img/woodelves.jpg" alt=""><img class="othumb" src="img/pikemaster.jpg" alt=""></span>
        <span class="sub">7 on the table</span>
        <span class="grow"></span><kbd>2</kbd>
      </div>
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 350px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 360px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 370px; top: 12px">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 380px; top: 12px">

      <img class="mini" src="img/baksida.jpg" alt="" style="left: 458px; top: 12px; --tx: 62px; --tr: 4deg; animation: miniFan 8.5s ease-in-out .08s infinite">
      <img class="mini" src="img/baksida.jpg" alt="" style="left: 458px; top: 12px; --tx: 78px; --tr: 12deg; animation: miniFan 8.5s ease-in-out .12s infinite">
      <i class="stripglow" style="animation: stripFlash 8.5s ease-in-out infinite"></i>
    </section>
  </div>

</div>
