<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Läsmarkeringen, prototyp</title>

<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0d1015}

.pill:hover{background:#1b2230}
.pill.pa{background:#2a2416;border-color:#f0a52a;color:#ffd98a}
.lopp{display:flex;flex-direction:column;gap:10px;background:#141922;border:1px solid #28313f;border-radius:12px;padding:14px 18px}
.spar{position:relative;height:6px;border-radius:3px;background:#232c3c}
.fyll{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#8a5d10}
.mk{position:absolute;top:-4px;width:2px;height:14px;margin-left:-1px;background:#39445a}
.mk.pa{background:#f0a52a}
.handelser{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;min-height:92px}
.h{font-size:13.5px;line-height:20px;color:#66748a}
.h b{display:inline-block;width:52px;font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:#66748a}

.h.pa b{color:#ffd98a}

.kol{display:flex;flex-direction:column;gap:10px;min-width:0}
.kol h2{margin:0;font-size:16px;font-weight:650}

.oppzon{position:absolute;left:0;right:0;top:0;height:200px;border-bottom:1px dashed #ffffff1c;background:#0f141bcc}
.zon{position:absolute;left:12px;top:10px;font:600 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#66748a}

.rad{margin:0;font-size:13.5px;line-height:1.45;color:#93a1b6}

.k .ofram{position:absolute;inset:0;z-index:3;box-sizing:border-box;border:4px solid #121417;border-radius:7px;overflow:hidden;background:#121417}

.a-moor{background-image:url(/_blob/89e676294ead1d4ea038dae6bfecbfd4)}
.a-heath{background-image:url(/_blob/128da63f067d045294b91840369c66c9)}

.a-bardiche{background-image:url(/_blob/1bc85d570d8cd694a7a4c070f2d2d657)}
.a-blightfang{background-image:url(/_blob/4587080e1c9c08215eacce188381d22c)}
.a-retriever{background-image:url(/_blob/93edebe69e7cce1dc9a5fc992f5f98ec)}
.f-flutterfox{background-image:url(/_blob/1913399e17f68d2c6ad4482eba175f64)}
.f-pikemaster{background-image:url(/_blob/862aa17754f42b77e3a48bae4aaf951b)}
.f-pharika{background-image:url(/_blob/b7d543dff5b13394f82f16913c145288)}
.f-moor{background-image:url(/_blob/54bafaafaa352efe69770a9cded4ba76)}
.f-inquisitor{background-image:url(/_blob/e8b716638799e4b41016ab5ebbc5f006)}
.f-bardiche{background-image:url(/_blob/ed0eb4247d1d11499455b238fb595a1c)}
.f-blightfang{background-image:url(/_blob/0a10de1103da15d7ce10d0332d431cfa)}
.f-retriever{background-image:url(/_blob/b9b666d57ee00ab91fb0d3d34a1eeab3)}
</style>
</helmet>
<div class="rot">
  <header class="hu">
    <div>
      <h1>Ett nytt kort: fotot direkt, namnet när det finns</h1>
      <p class="sub">Mirror my table · tre sätt att visa att ett kort läses · samma fall i alla tre</p>
    </div>
    <div class="spel">
      <span class="tid">{{tid}}</span>
      <button type="button" class="knp" onClick="{{paus}}">{{pausText}}</button>
      <button type="button" class="knp" onClick="{{igen}}">Spela igen</button>
    </div>
  </header>
  <nav class="fall" aria-label="Fallen">
    <sc-for list="{{fallen}}" as="f" hint-placeholder-count="7">
      <button type="button" class="{{f.kl}}" onClick="{{f.valj}}">{{f.knapp}}</button>
    </sc-for>
  </nav>
  <section class="lopp" aria-label="Vad som händer">
    <div class="spar">
      <div class="fyll" style="width: {{framsteg}}%"></div>
      <sc-for list="{{markor}}" as="m" hint-placeholder-count="3">
        <i class="{{m.kl}}" style="left: {{m.x}}%"></i>
      </sc-for>
    </div>
    <ol class="handelser">
      <sc-for list="{{hand}}" as="h" hint-placeholder-count="3">
        <li class="{{h.kl}}"><b>{{h.tid}}</b>{{h.txt}}</li>
      </sc-for>
    </ol>
  </section>
  <div class="kol3">
    <sc-for list="{{kolumner}}" as="k" hint-placeholder-count="3">
      <section class="kol">
        <h2>{{k.namn}}<span>{{k.sub}}</span></h2>
        <div class="matta">
          <sc-if value="{{k.opp}}" hint-placeholder-val="{{false}}">
            <div class="oppzon"><span class="zon">Opponent</span></div>
            <span class="zon du">You</span>
          </sc-if>
          <sc-for list="{{k.kort}}" as="c" hint-placeholder-count="2">
            <div class="k" style="left: {{c.x}}px; top: {{c.y}}px; opacity: {{c.op}}; transform: {{c.tf}}">
              <div class="skugga" style="opacity: {{c.skugga}}"></div>
              <div class="bas"></div>
              <div class="{{c.aKl}}" style="opacity: {{c.konstOp}}; clip-path: inset(0 0 {{c.klipp}}% 0)"></div>
              <div class="ofram" style="opacity: {{c.ofrOp}}">
                <div class="{{c.fKl}}" style="filter: blur({{c.blur}}px) saturate({{c.sat}}) brightness({{c.bri}})"></div>
                <div class="{{c.sKl}}" style="opacity: {{c.skarp}}"></div>
                <div class="oglans" style="opacity: {{c.glans}}"></div>
              </div>
              <div class="prick" style="opacity: {{c.prick}}"></div>
              <div class="ring" style="opacity: {{c.ring}}"></div>
              <sc-if value="{{c.fraga}}" hint-placeholder-val="{{false}}">
                <span class="etik" style="opacity: {{c.fragaOp}}">NOT IDENTIFIED</span>
                <button type="button" class="knapp" style="opacity: {{c.fragaOp}}">Enter name</button>
              </sc-if>
            </div>
          </sc-for>
        </div>
        <p class="rad">{{k.rad}}</p>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tempo":{"editor":"enum","options":["1×","0,5×","0,25×"],"default":"1×"},"overgang":{"editor":"enum","options":["Tona 300 ms","Svep 380 ms"],"default":"Tona 300 ms"},"framkallningstid":{"editor":"range","min":800,"max":4000,"step":100,"unit":"ms","default":1800,"section":"B · Framkallas i takt"},"$preview":{"width":1440,"height":980}}'>
const SLUT = 8000;
const kl = x => Math.max(0, Math.min(1, x));
const ut = p => 1 - Math.pow(1 - p, 3);
const sek = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';
const VARIANTER = [
  { id: 'A', namn: 'A · Stilla sudd', sub: 'som i dag, men direkt vid släppet', rad: 'Fotot ligger suddigt och stilla tills namnet finns. Ingenting på kortet rör sig.' },
  { id: 'B', namn: 'B · Framkallas i takt', sub: 'som en polaroid', rad: 'Fotot klarnar sakta medan kortet läses. Skarp mitt och etikett kommer först när spelaren behövs.' },
  { id: 'C', namn: 'C · Tyst prick', sub: 'stilla sudd och en prick', rad: 'Stilla sudd och en liten prick i hörnet som andas långsamt medan kortet läses.' }
];
const FALL = [
  { id: 'lokal', knapp: 'Lokalt efter 1 s', kort: [{ b: 'flutterfox', slapp: 0, namn: 1000 }],
    hand: [[0, 'Kortet ligger still och läggs ned med kamerans foto'], [1000, 'Telefonen: säkert namn, Flutterfox']] },
  { id: 'claude', knapp: 'Via Claude efter 3 s', kort: [{ b: 'pikemaster', slapp: 0, namn: 3000 }],
    hand: [[0, 'Kortet ligger still och läggs ned med kamerans foto'], [900, 'Telefonen är inte säker och frågar Claude'], [3000, 'Claude: Faithful Pikemaster']] },
  { id: 'spelaren', knapp: 'Inget namn: spelaren', kort: [{ b: 'pharika', slapp: 0, pend: 3200, spelaren: 6500 }],
    hand: [[0, 'Kortet ligger still och läggs ned med kamerans foto'], [900, 'Telefonen är inte säker och frågar Claude'], [3200, 'Claude är inte heller säker: kortet går till spelaren'], [6500, 'Spelaren skriver Pharika’s Chosen']] },
  { id: 'byter', knapp: 'Byter namn', kort: [{ b: 'moor', slapp: 0, namn: 2200 }],
    hand: [[0, 'Kortet ligger still och läggs ned med kamerans foto'], [700, 'Telefonen gissar Thriving Heath, osäkert: gissningen visas inte'], [2200, 'ORB bär Thriving Moor: säkert namn']] },
  { id: 'flera', knapp: 'Flera kort på en gång', kort: [{ b: 'inquisitor', slapp: 0, namn: 600, plats: 0 }, { b: 'bardiche', slapp: 150, namn: 1500, plats: 1 }, { b: 'retriever', slapp: 300, namn: 3400, plats: 2 }],
    hand: [[0, 'Tre kort läggs ut i ett svep'], [600, 'Militant Inquisitor: lokalt'], [1500, 'Mirran Bardiche: lokalt'], [3400, 'Trusty Retriever: via Claude']] },
  { id: 'motst', knapp: 'Motståndarens kort', kort: [{ b: 'blightfang', slapp: 0, namn: 2600, opp: true }],
    hand: [[0, 'Motståndaren lägger ett kort. Du ser en liten suddig bild, aldrig den skarpa'], [2600, 'Hens telefon eller Claude: Hooded Blightfang']] },
  { id: 'utan', knapp: 'Claude av eller taket nått', kort: [{ b: 'pikemaster', slapp: 0, pend: 900, spelaren: 5000 }],
    hand: [[0, 'Kortet ligger still och läggs ned med kamerans foto'], [900, 'Telefonen är inte säker, och Claude går inte att fråga: kortet går till spelaren'], [5000, 'Spelaren skriver Faithful Pikemaster']] }
];
function rita(c, t, v, o, cx, cy, s) {
  const dt = t - c.slapp;
  if (dt < 0) return null;
  const st = o.still;
  const op = st ? 1 : kl(dt / 90);
  let sc = 1;
  if (!st) sc = dt < 260 ? 1.08 - 0.06 * ut(dt / 260) : dt < 330 ? 1.02 - 0.035 * ((dt - 260) / 70) : dt < 400 ? 0.985 + 0.015 * ((dt - 330) / 70) : 1;
  const dy = st ? 0 : 90 * (1 - ut(kl(dt / 330))) * (c.opp ? -1 : 1) * s;
  const skugga = st ? 0 : dt < 200 ? 1 : kl(1 - (dt - 200) / 130);
  const namnT = c.namn != null ? c.namn : c.spelaren != null ? c.spelaren : null;
  const pendT = c.pend != null ? c.pend : null;
  const ovT = o.overgang === 'svep' ? 380 : 300;
  let lage = 'las', p = 0;
  if (namnT != null && t >= namnT && (pendT == null || c.spelaren == null || t >= c.spelaren)) { lage = 'namn'; p = st ? 1 : kl((t - namnT) / ovT); }
  else if (pendT != null && t >= pendT) { lage = 'pend'; p = st ? 1 : kl((t - pendT) / 300); }
  let e = 0;
  if (v === 'B') {
    const fram = x => 1 - Math.exp(-Math.max(0, x) / o.bTid);
    if (pendT != null && t >= pendT) { const e0 = fram(pendT - c.slapp); e = e0 + (1 - e0) * (lage === 'pend' ? ut(p) : 1); }
    else e = fram(dt);
  }
  let blur = 12 - 8.5 * e, sat = 0.62 + 0.36 * e, bri = 0.8 + 0.17 * e, glans = 0.55 - 0.3 * e;
  if (c.opp) { blur = 16 - 6 * e; glans = 0.55; }
  let prick = 0;
  if (v === 'C') prick = st ? 0.85 : 0.35 + 0.5 * (0.5 - 0.5 * Math.cos(2 * Math.PI * dt / 2400));
  if (lage !== 'las') prick *= 1 - p;
  let konstOp = 0, klipp = 100, ofrOp = 1, skarp = 0, ring = 0, fragaOp = 0;
  if (lage === 'namn') {
    if (o.overgang === 'svep') { konstOp = 1; klipp = (1 - ut(p)) * 100; ofrOp = p >= 1 ? 0 : 1; }
    else { konstOp = ut(p); klipp = 0; ofrOp = 1 - ut(p); }
    if (!st) sc *= 1 + 0.015 * Math.sin(Math.PI * p);
    skarp = pendT != null && !c.opp ? 1 : 0;
    const rt = t - namnT - ovT;
    ring = st ? (t - namnT < 2000 ? 1 : 0) : rt < 0 ? 0 : rt < 700 ? ut(rt / 700) : rt < 1900 ? 1 : kl(1 - (rt - 1900) / 600);
  } else if (lage === 'pend' && !c.opp) { skarp = ut(p); fragaOp = ut(p); }
  const f = n => n.toFixed(3);
  return {
    x: (cx - 60).toFixed(1), y: (cy - 84).toFixed(1), op: f(op), skugga: f(skugga),
    tf: 'translate(0px, ' + dy.toFixed(1) + 'px) scale(' + (sc * s).toFixed(4) + ') rotate(' + (c.opp ? 180 : 0) + 'deg)',
    aKl: 'konst a-' + c.b, fKl: 'ofoto f-' + c.b, sKl: 'ofoto oskarp f-' + c.b,
    konstOp: f(konstOp), klipp: klipp.toFixed(1), ofrOp: f(ofrOp),
    blur: blur.toFixed(2), sat: f(sat), bri: f(bri), glans: f(glans),
    skarp: f(skarp), prick: f(prick), ring: f(ring),
    fraga: lage === 'pend' && !c.opp, fragaOp: f(fragaOp)
  };
}
function matKort(fall, t, v, o, W, H) {
  const st = o.still, ut_ = [];
  const lagg = k => { if (k) ut_.push(k); };
  if (!st && fall.id !== 'flera' && fall.id !== 'motst') lagg(rita({ b: 'retriever', slapp: -9000, namn: -8000 }, t, v, o, 96, H / 2, 1));
  if (!st && fall.id === 'motst') lagg(rita({ b: 'flutterfox', slapp: -9000, namn: -8000 }, t, v, o, W / 2, 338, 1));
  for (const c of fall.kort) {
    let cx = st ? W / 2 : 268, cy = H / 2, s = st ? 0.78 : 1;
    if (fall.id === 'flera') { s = st ? 0.36 : 0.92; cx = W / 2 + (c.plats - 1) * (st ? 46 : 132); }
    else if (c.opp) { s = st ? 0.42 : 0.68; cx = W / 2; cy = st ? 42 : 104; }
    lagg(rita(c, t, v, o, cx, cy, s));
  }
  return ut_;
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fall: 'claude', t: 0, spelar: true };
    this.senast = 0;
  }
  componentDidMount() {
    this.senast = performance.now();
    this.iv = setInterval(() => {
      const nu = performance.now(), d = nu - this.senast;
      this.senast = nu;
      if (!this.state.spelar) return;
      const tempo = this.props.tempo === '0,25×' ? 0.25 : this.props.tempo === '0,5×' ? 0.5 : 1;
      const t = Math.min(SLUT, this.state.t + d * tempo);
      this.setState({ t, spelar: t < SLUT });
    }, 33);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const o = { still: false, overgang: this.props.overgang === 'Svep 380 ms' ? 'svep' : 'tona', bTid: this.props.framkallningstid ?? 1800 };
    const fall = FALL.find(x => x.id === this.state.fall) || FALL[0];
    const t = this.state.t;
    const borja = (id) => { this.senast = performance.now(); this.setState({ fall: id, t: 0, spelar: true }); };
    return {
      fallen: FALL.map(x => ({ knapp: x.knapp, kl: x.id === fall.id ? 'pill pa' : 'pill', valj: () => borja(x.id) })),
      tid: sek(t),
      pausText: this.state.spelar ? 'Pausa' : 'Spela',
      paus: () => {
        this.senast = performance.now();
        if (this.state.t >= SLUT) this.setState({ t: 0, spelar: true });
        else this.setState({ spelar: !this.state.spelar });
      },
      igen: () => borja(fall.id),
      framsteg: (t / SLUT * 100).toFixed(2),
      markor: fall.hand.map(([ms]) => ({ x: (ms / SLUT * 100).toFixed(2), kl: t >= ms ? 'mk pa' : 'mk' })),
      hand: fall.hand.map(([ms, txt]) => ({ tid: sek(ms), txt, kl: t >= ms ? 'h pa' : 'h' })),
      kolumner: VARIANTER.map(v => ({ namn: v.namn, sub: v.sub, rad: v.rad, opp: fall.id === 'motst', kort: matKort(fall, t, v.id, o, 432, 470) }))
    };
  }
}
</script>
