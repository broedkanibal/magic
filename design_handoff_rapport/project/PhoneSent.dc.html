<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report sent, on the phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rap.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0d12}
</style>
</helmet>
<div class="ab" style="width: 440px; height: 840px; padding: 30px 25px; background: #070a0e">
  <div class="phone full">
    <div class="feed">
      <div class="cd island" style="left: 16%; top: 22%; transform: rotate(-3deg)"></div>
      <div class="cd sorc" style="left: 42%; top: 19%"></div>
      <div class="cd mtn" style="left: 66%; top: 23%"></div>
    </div>
    <div class="ptop">
      <span class="prick"></span><b>K7QX</b><span class="grow"></span>
      <button class="btn sm ghostdark" type="button" style="height: 30px; padding: 0 9px; font-size: 12px">Disconnect</button>
    </div>
    <div class="phonescrim"></div>
    <div class="sheet">
      <span class="grab"></span>
      <div class="done" style="padding-top: 14px">
        <span class="ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span>
        <h3>Report <span class="code">R-0412</span> sent</h3>
        <p class="dim">Your computer sent it. If you write to us about it, mention R-0412.</p>
      </div>
      <button class="btn prim wide" type="button" style="height: 48px">Done</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":840}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
