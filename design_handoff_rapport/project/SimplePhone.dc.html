<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X4 · Simple report on the phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rap.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0d12}
</style>
</helmet>
<div class="ab" style="width: 440px; height: 840px; padding: 30px 25px; background: #070a0e">
  <div class="phone full">
    <div class="feed">
      <div class="cd island" style="left: 12%; top: 16%; transform: rotate(-3deg)"></div>
      <div class="cd island" style="left: 38%; top: 14%"></div>
      <div class="cd mtn" style="left: 64%; top: 17%"></div>
    </div>
    <div class="ptop">
      <span class="prick"></span><b>K7QX</b><span class="grow"></span>
      <button class="btn sm ghostdark" type="button" style="height: 30px; padding: 0 9px; font-size: 12px">Disconnect</button>
    </div>
    <div class="sheet" style="gap: 12px; padding-bottom: 22px">
      <span class="grab"></span>
      <h2>Report a problem</h2>
      <textarea class="ta" placeholder="What happened?" aria-label="What happened?" style="height: 70px"></textarea>
      <div class="chips">
        <button class="chip" type="button">A card disappeared</button>
        <button class="chip on" type="button">A card appeared that I didn't play</button>
        <button class="chip" type="button">A card never showed up</button>
        <button class="chip" type="button">Wrong name</button>
        <button class="chip" type="button">Tapped or untapped wrong</button>
        <button class="chip" type="button">Slow</button>
        <button class="chip" type="button">Something else</button>
      </div>
      <button class="btn prim wide" type="button" style="height: 48px">Send report</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":840}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
