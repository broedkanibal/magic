<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report a problem</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rap.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0d12}
a{color:#a9bcff}a:hover{color:#c6d3ff}
</style>
</helmet>
<div class="ab" style="width: 520px; height: 700px; padding: 30px 30px; background: #070a0e">
  <section class="pop" aria-label="Report a problem">
    <header class="hd2">
      <h2>Report a problem</h2>
      <button class="x" type="button" aria-label="Close" onClick="{{reset}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>

    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <div class="bd">
        <div>
          <label class="lbl" for="rapTxt">What went wrong?</label>
          <input class="inp" id="rapTxt" type="text" placeholder="For example: it showed Island, I played Swamp" disabled="{{busy}}">
        </div>
        <div>
          <span class="lbl">What kind of problem</span>
          <div class="chips">
            <sc-for list="{{tags}}" as="t" hint-placeholder-count="5">
              <button class="{{t.cls}}" type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" disabled="{{busy}}">{{t.label}}</button>
            </sc-for>
          </div>
        </div>
        <div class="what">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          <p><b>Sends the last 10 minutes of this game,</b> with pictures from your phone's camera, to fix problems and improve Mesa's card recognition, including training our models. <a href="https://magic-mauve-xi.vercel.app/privacy.html">What's in a report</a></p>
        </div>
        <sc-if value="{{busy}}" hint-placeholder-val="{{ false }}">
          <div class="bar2" role="progressbar" aria-label="Sending"><i></i></div>
        </sc-if>
      </div>
      <footer class="ft">
        <span class="grow"></span>
        <button class="btn ghost" type="button" onClick="{{reset}}">Cancel</button>
        <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
          <button class="btn prim" type="button" onClick="{{send}}">Send report</button>
        </sc-if>
        <sc-if value="{{busy}}" hint-placeholder-val="{{ false }}">
          <button class="btn prim" type="button" disabled><span class="spin"></span>Sending</button>
        </sc-if>
      </footer>
    </sc-if>

    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div class="bd">
        <div class="done">
          <span class="ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span>
          <h3>Report <span class="code">R-0412</span> sent</h3>
          <p class="dim">Thanks. If you write to us about it, mention R-0412.</p>
        </div>
      </div>
      <footer class="ft">
        <button class="btn ghost" type="button">Copy code</button>
        <span class="grow"></span>
        <button class="btn prim" type="button" onClick="{{reset}}">Done</button>
      </footer>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tag: null, step: 'idle' };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.state;
    const labels = ['Wrong card', "Can't see the card", 'Slow', 'Flicker', 'Other'];
    return {
      tags: labels.map((label) => ({
        label,
        on: s.tag === label,
        cls: s.tag === label ? 'chip on' : 'chip',
        pick: () => this.setState({ tag: s.tag === label ? null : label })
      })),
      idle: s.step === 'idle',
      busy: s.step === 'busy',
      sent: s.step === 'sent',
      notSent: s.step !== 'sent',
      send: () => {
        this.setState({ step: 'busy' });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ step: 'sent' }), 1600);
      },
      reset: () => { clearTimeout(this.t); this.setState({ step: 'idle', tag: null }); }
    };
  }
}
</script>
</body>
</html>
