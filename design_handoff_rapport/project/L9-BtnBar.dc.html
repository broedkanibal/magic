<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The button · always in the top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rap.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0d12}
</style>
</helmet>
<div class="ab" style="width: 1060px; height: 660px; padding: 22px 24px; display: flex; gap: 34px; background: #070a0e">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <p class="cap"><b>Computer</b>a button beside the camera pill, on every game screen</p>
    <div style="position: relative; width: 680px; height: 590px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--bg)">
      <header class="bar">
        <span class="brand"><svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.6 28.2 9.2 16 15.8 3.8 9.2Z" fill="none" stroke="#6b8cff" stroke-width="2.1" stroke-linejoin="round"></path><path d="M16 16.6 28.2 23.2 16 29.8 3.8 23.2Z" fill="#f0a52a"></path></svg>Mesa<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
        <span class="grow"></span>
        <button class="iconbtn" type="button" title="Report a problem"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1-7 0a5 5 0 0 0-7 0z"></path><path d="M5 21v-7"></path></svg>Report a problem</button>
        <span class="pill"><span class="led"></span>Camera · 3 cards</span>
      </header>
      <div class="mat">
        <div class="mcard island" style="left: 210px; top: 150px; transform: rotate(-2deg)"></div>
        <div class="mcard sorc" style="left: 290px; top: 160px"></div>
        <div class="mcard mtn" style="left: 370px; top: 150px; transform: rotate(1deg)"></div>
        <div class="mcard forest" style="left: 300px; top: 300px; transform: rotate(90deg)"></div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <p class="cap"><b>Phone</b>in the top bar, beside Disconnect</p>
    <div class="phone">
      <div class="feed">
        <div class="cd island" style="left: 16%; top: 36%; transform: rotate(-3deg)"></div>
        <div class="cd sorc" style="left: 42%; top: 33%"></div>
        <div class="cd mtn" style="left: 66%; top: 37%"></div>
      </div>
      <div class="ptop">
        <span class="prick"></span><b>K7QX</b><span class="grow"></span>
        <button class="btn sm ghostdark" type="button" style="height: 30px; padding: 0 9px; font-size: 12px; "><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1-7 0a5 5 0 0 0-7 0z"></path><path d="M5 21v-7"></path></svg>Report a problem</button>
        <button class="btn sm ghostdark" type="button" style="height: 30px; padding: 0 9px; font-size: 12px">Disconnect</button>
      </div>
      <div class="pbot">
        <p class="s1">3 cards on the table</p>
        <p class="s2">The computer shows them as you play.</p>
        <div class="pknappar"><button class="btn ghostdark" type="button">Read the whole table</button><button class="btn ghostdark" type="button">Keep the picture on</button></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1060,"height":660}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
