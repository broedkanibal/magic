<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create your account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rap.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0d12}
a{color:#e7ecf4}a:hover{color:#ffffff}
</style>
</helmet>
<div class="ab portalbg" style="width: 520px; height: 800px">
  <div class="portalkort">
    <div class="marke">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.6 28.2 9.2 16 15.8 3.8 9.2Z" fill="none" stroke="#6b8cff" stroke-width="2.1" stroke-linejoin="round"></path><path d="M16 16.6 28.2 23.2 16 29.8 3.8 23.2Z" fill="#f0a52a"></path></svg>
      <div><b>Create your account</b><span>Free during the beta · Google account</span></div>
    </div>

    <label class="villkor">
      <input type="checkbox" checked="{{terms}}" onChange="{{flipTerms}}">
      <span>I agree to the <a href="https://magic-mauve-xi.vercel.app/terms.html">Terms and Conditions</a> and have read the <a href="https://magic-mauve-xi.vercel.app/privacy.html">Privacy Policy</a>.</span>
    </label>

    <label class="villkor">
      <input type="checkbox" checked="{{pics}}" onChange="{{flipPics}}">
      <span><b>Share pictures of cards I correct.</b> When you fix a card's name, Mesa keeps the picture of that card to fix problems and improve its card recognition, including training our models.<small>Optional. You can change it any time in Settings.</small></span>
    </label>

    <p class="fin">Mesa records how you use the app and any errors, linked to your account, to find and fix problems. <a href="https://magic-mauve-xi.vercel.app/privacy.html">What and why</a></p>

    <button class="google" type="button" disabled="{{locked}}">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.6z"></path><path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.4 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3C3.7 21.4 7.6 24 12 24z"></path><path fill="#FBBC05" d="M5.6 14.7a7.2 7.2 0 0 1 0-4.6v-3H1.8a12 12 0 0 0 0 10.6l3.8-3z"></path><path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.2 15.1 0 12 0 7.6 0 3.7 2.6 1.8 6.3l3.8 3C6.5 6.7 9 4.8 12 4.8z"></path></svg>
      <span>Sign up with Google</span>
    </button>
    <p class="bytrad">Already have an account? <u>Sign in</u></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { terms: false, pics: false };
  }
  renderVals() {
    const s = this.state;
    return {
      terms: s.terms,
      pics: s.pics,
      locked: !s.terms,
      flipTerms: () => this.setState({ terms: !s.terms }),
      flipPics: () => this.setState({ pics: !s.pics })
    };
  }
}
</script>
</body>
</html>
