<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report sent</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rap.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0d12}
</style>
</helmet>
<div class="ab" style="width: 520px; height: 700px; padding: 30px 30px; background: #070a0e">
  <section class="pop" aria-label="Report a problem">
    <header class="hd2">
      <h2>Report a problem</h2>
      <button class="x" type="button" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>
    <div class="bd">
      <div class="done">
        <span class="ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span>
        <h3>Report sent</h3>
        <div style="display: flex; align-items: center; gap: 8px">
          <span class="code">R-0412</span>
          <button class="btn sm" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>Copy</button>
        </div>
        <p class="dim">Thanks. If you write to us about it, mention this code.</p>
      </div>
    </div>
    <footer class="ft">
      <span class="grow"></span>
      <button class="btn prim" type="button">Done</button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
