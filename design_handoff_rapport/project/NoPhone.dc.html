<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report · phone not connected</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rap.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0d12}
a{color:#a9bcff}a:hover{color:#c6d3ff}
</style>
</helmet>
<div class="ab" style="width: 520px; height: 700px; padding: 30px 30px; background: #070a0e">
  <section class="pop" aria-label="Report a problem">
    <header class="hd2">
      <h2>Report a problem</h2>
      <button class="x" type="button" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>
    <div class="bd">
      <div>
        <label class="lbl" for="t1">What went wrong?</label>
        <input class="inp" id="t1" type="text" value="The camera stopped after I flipped the phone">
      </div>
      <div>
        <span class="lbl">What kind of problem</span>
        <div class="chips">
          <button class="chip" type="button">Wrong card</button>
          <button class="chip" type="button">Can't see the card</button>
          <button class="chip" type="button">Slow</button>
          <button class="chip" type="button">Flicker</button>
          <button class="chip on" type="button">Other</button>
        </div>
      </div>
      <div class="alert warn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M3 3l18 18"></path></svg>
        <p><b>Your phone isn't connected.</b> The report is sent from this computer, without the phone's pictures.</p>
      </div>
      <div class="what">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8"></path><path d="M12 16v4"></path></svg>
        <p><b>Sends the last 10 minutes of this game</b> from this computer, to fix problems and improve Mesa's card recognition, including training our models. <a href="https://magic-mauve-xi.vercel.app/privacy.html">What's in a report</a></p>
      </div>
    </div>
    <footer class="ft">
      <span class="grow"></span>
      <button class="btn ghost" type="button">Cancel</button>
      <button class="btn prim" type="button">Send report</button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
