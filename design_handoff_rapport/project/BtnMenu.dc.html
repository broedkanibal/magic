<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>V1 · In the menu and the camera panel</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rap.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0d12}
</style>
</helmet>
<div class="ab" style="width: 1060px; height: 660px; padding: 22px 24px; display: flex; gap: 34px; background: #070a0e">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <p class="cap"><b>Computer</b>menu open, and the camera panel</p>
    <div style="position: relative; width: 680px; height: 590px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--bg)">
      <header class="bar">
        <span class="brand open"><svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.6 28.2 9.2 16 15.8 3.8 9.2Z" fill="none" stroke="#6b8cff" stroke-width="2.1" stroke-linejoin="round"></path><path d="M16 16.6 28.2 23.2 16 29.8 3.8 23.2Z" fill="#f0a52a"></path></svg>Mesa<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
        <span class="grow"></span>
        <span class="pill"><span class="led"></span>Camera · 3 cards</span>
      </header>
      <div class="mat">
        <div class="mcard island" style="left: 290px; top: 140px; transform: rotate(-2deg)"></div>
        <div class="mcard sorc" style="left: 360px; top: 150px"></div>
      </div>

      <div class="menu" style="left: 12px; top: 56px">
        <button type="button">Back to my games</button>
        <hr>
        <p class="hd">Jesper</p>
        <p class="hd">Table mode</p>
        <button class="on" type="button">Mirror my table<span class="kbd" style="color: var(--green)">✓</span></button>
        <button type="button">Digital table</button>
        <button type="button">Match the camera<span class="kbd">M</span></button>
        <hr>
        <p class="hd">Game K7QX</p>
        <button type="button">Copy invitation link</button>
        <button class="danger" type="button">Clear my board</button>
        <hr>
        <p class="hd">Deck &amp; recognition</p>
        <button type="button">AI help<span class="kbd" style="color: var(--green)">ON</span></button>
        <button class="hl" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1-7 0a5 5 0 0 0-7 0z"></path><path d="M5 21v-7"></path></svg>Report a problem</button>
        <hr>
        <button type="button">Sign out</button>
      </div>

      <section class="pop" aria-label="Camera" style="position: absolute; right: 12px; top: 58px; width: 380px">
        <header class="hd2"><h2 style="font-size: 15px">Camera</h2><button class="x" type="button" aria-label="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></header>
        <div class="bd" style="gap: 12px">
          <div class="cam" role="img" aria-label="The phone's picture: three cards">
            <div class="cd island" style="left: 25%; top: 33%; transform: rotate(-3deg)"></div>
            <div class="cd sorc" style="left: 44%; top: 29%"></div>
            <div class="cd mtn" style="left: 63%; top: 34%"></div>
          </div>
          <div class="st"><span class="ic"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span><p><b>3 cards on the table</b> · all recognised</p></div>
          <div class="row"><span class="grow">Mat doesn't match your table?</span><button class="btn sm" type="button">Match</button></div>
        </div>
        <footer class="ft">
          <button class="btn ghost sm" type="button" style="color: #f6c46a; outline: 2px solid #f0a52a; outline-offset: 1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1-7 0a5 5 0 0 0-7 0z"></path><path d="M5 21v-7"></path></svg>Report a problem</button>
          <span class="grow"></span>
          <button class="btn ghost sm" type="button">Pause camera</button>
        </footer>
      </section>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <p class="cap"><b>Phone</b>in the top bar, beside Disconnect</p>
    <div class="phone">
      <div class="feed">
        <div class="cd island" style="left: 16%; top: 36%; transform: rotate(-3deg)"></div>
        <div class="cd sorc" style="left: 42%; top: 33%"></div>
        <div class="cd mtn" style="left: 66%; top: 37%"></div>
      </div>
      <div class="ptop">
        <span class="prick"></span><b>K7QX</b><span class="grow"></span>
        <button class="btn sm ghostdark" type="button" style="height: 30px; padding: 0 9px; font-size: 12px; outline: 2px solid #f0a52a"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1-7 0a5 5 0 0 0-7 0z"></path><path d="M5 21v-7"></path></svg>Report</button>
        <button class="btn sm ghostdark" type="button" style="height: 30px; padding: 0 9px; font-size: 12px">Disconnect</button>
      </div>
      <div class="pbot">
        <p class="s1">3 cards on the table</p>
        <p class="s2">The computer shows them as you play.</p>
        <div class="pknappar"><button class="btn ghostdark" type="button">Read the whole table</button><button class="btn ghostdark" type="button">Keep the picture on</button></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1060,"height":660}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
