<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report · today's limit</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rap.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0d12}
</style>
</helmet>
<div class="ab" style="width: 520px; height: 700px; padding: 30px 30px; background: #070a0e">
  <section class="pop" aria-label="Report a problem">
    <header class="hd2">
      <h2>Report a problem</h2>
      <button class="x" type="button" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </header>
    <div class="bd">
      <div class="alert warn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <p><b>You have sent 20 reports today.</b> That is the most for one day. You can send more tomorrow.</p>
      </div>
      <p class="note">The box says this as soon as it opens, before anything is typed. Earlier reports are not affected.</p>
    </div>
    <footer class="ft">
      <span class="grow"></span>
      <button class="btn" type="button">Close</button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
