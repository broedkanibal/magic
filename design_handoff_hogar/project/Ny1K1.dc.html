<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>K1 · Library found, said in the pile's tag</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./mesa.css">
<link rel="stylesheet" href="./hogar.css">
<link rel="stylesheet" href="./hogar2.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0d1015}
a{color:#6b8cff}a:hover{color:#8ea6ff}
</style>
</helmet>
<div class="ab crop2" style="width: 1061px; height: 722px">
  <section class="matta" style="position: absolute; left: 10px; top: 10px; width: 1041px; height: 702px">
    <div class="mtom" style="top: 200px"><b>Play your first card</b>Mesa learns your table as you play</div>
    <sc-if value="{{ar}}" hint-placeholder-val="{{ true }}">
      <div class="st lib" style="left: 560px; top: 440px">
        <span class="slv" role="img" aria-label="Library, 33 cards"></span>
        <span class="hc bla"><span class="ok"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8fa8ff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Library</span><b>33</b><i class="kvsep"></i><button onClick="{{nej}}">Not my library</button></span>
      </div>
    </sc-if>
    <sc-if value="{{inte}}" hint-placeholder-val="{{ false }}">
      <div class="card" style="left: 560px; top: 440px">
        <span class="slv" role="img" aria-label="A face-down card"></span>
        <span class="hc"><span>Face-down card</span><i class="kvsep"></i><button onClick="{{ja}}">It's my library</button></span>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1061,"height":722}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { inte: false }; }
  renderVals() {
    return {
      ar: !this.state.inte,
      inte: this.state.inte,
      nej: () => this.setState({ inte: true }),
      ja: () => this.setState({ inte: false })
    };
  }
}
</script>
</body>
</html>
