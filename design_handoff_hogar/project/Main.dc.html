<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>K1 · Library found, said at the pile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./mesa.css">
<link rel="stylesheet" href="./hogar.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0d1015}
a{color:#6b8cff}a:hover{color:#8ea6ff}
</style>
</helmet>
<div class="ab full" style="width: 1440px; height: 900px">
  <header class="topbar">
    <button class="brand" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.6 28.2 9.2 16 15.8 3.8 9.2Z" fill="none" stroke="#6b8cff" stroke-width="2.1" stroke-linejoin="round"></path><path d="M16 16.6 28.2 23.2 16 29.8 3.8 23.2Z" fill="#f0a52a"></path></svg><span>Mesa</span><svg class="cv" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    <button class="spelknapp" aria-label="Copy the invitation link, code JX4QFD"><span class="kod">JX4QFD</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 6h3a3 3 0 0 1 0 6h-3"></path><path d="M8 18H5a3 3 0 0 1 0-6h3"></path><path d="M8 12h8"></path></svg></button>
    <div class="topspacer"></div>
    <button class="campill"><span class="led" style="background: #57c785"></span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg><span>Camera · ready</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    <div class="vr"></div>
    <button class="btn ghost" aria-label="Keyboard shortcuts"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"></circle><path d="M9.3 9.3a2.8 2.8 0 1 1 3.4 3.4v1.1"></path><path d="M12 17.2v.01"></path></svg></button>
  </header>

  <div class="main">
    <div class="bord">
      <section class="omatta" style="height: 46px; --pc: #b782ff">
        <div class="olist">
          <i class="bdot"></i><b>Sara</b><span class="sep"></span>
          <span class="sub">0 on the table</span><span class="sep"></span>
          <span class="sub"><b>7</b> in hand</span><span class="sep"></span>
          <span class="sub"><b>33</b> in library</span>
          <span class="grow"></span><kbd>2</kbd>
        </div>
        <span class="ovinj"></span>
      </section>

      <div class="kant3" style="top: 46px">
        <i class="edgeline"></i>
        <div class="ssw">
          <span class="egrip"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><circle cx="4" cy="2" r="1.1"></circle><circle cx="8" cy="2" r="1.1"></circle><circle cx="4" cy="6" r="1.1"></circle><circle cx="8" cy="6" r="1.1"></circle><circle cx="4" cy="10" r="1.1"></circle><circle cx="8" cy="10" r="1.1"></circle></svg></span>
          <button class="sseg mine on"><i class="bdot" style="--pc: #f0a52a"></i><span>Me</span><kbd>1</kbd></button>
          <button class="sseg alla"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="5.5" r="2.6"></circle><circle cx="11" cy="5.5" r="2.6"></circle><circle cx="8" cy="10.5" r="2.6"></circle></svg><span>Everyone</span><kbd>E</kbd></button>
          <button class="sseg opp"><i class="bdot" style="--pc: #b782ff"></i><span>Sara</span><kbd>2</kbd></button>
          <span class="spil"><kbd>↑</kbd><kbd>↓</kbd></span>
        </div>
      </div>

      <section class="matta" style="top: 102px; height: 702px">
        <div class="mattachrome">
          <div class="zoomchip"><span class="zsteg">−</span><span class="ztxt">73% fit</span><span class="zsteg">+</span></div>
          <button class="btn sm">Untap all <kbd>U</kbd></button>
          <button class="btn sm">Tidy up</button>
        </div>

        <div class="mtom"><b>Play your first card</b>Mesa learns your table as you play</div>

        <div class="gravhog">
          <button class="grav" aria-label="Graveyard, empty"></button>
          <span class="hograd"><i></i>Graveyard</span>
        </div>

        <sc-if value="{{ar}}" hint-placeholder-val="{{ true }}">
          <div class="bibhog">
            <button class="bib" aria-label="Library, 33 cards"><span class="biblek"><img src="img/baksida.jpg" alt=""><img src="img/baksida.jpg" alt=""><img src="img/baksida.jpg" alt=""></span></button>
            <span class="hograd"><i></i>Library <b>33</b></span>
          </div>
          <div class="kv bla" style="left: 152px; top: 642px">
            <span class="ok"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Library</span>
            <i class="kvsep"></i>
            <button onClick="{{nej}}">Not my library</button>
          </div>
        </sc-if>

        <sc-if value="{{inte}}" hint-placeholder-val="{{ false }}">
          <div class="bibhog">
            <button class="bib tom" aria-label="Library, not on the table yet"></button>
            <span class="hograd"><i></i>Library <b>33</b></span>
          </div>
          <div class="card" style="left: 620px; top: 300px"><img src="img/baksida.jpg" alt="A face-down card"></div>
          <div class="kv" style="left: 588px; top: 494px">
            <span class="ok">Face-down card</span>
            <i class="kvsep"></i>
            <button onClick="{{ja}}">It's my library</button>
          </div>
        </sc-if>
      </section>
    </div>

    <aside class="inspektor">
      <div class="zonrub markrub"><span class="zonlbl">Last card</span><i class="zonlinje"></i></div>
      <div style="flex: none; width: 369px; height: 516px; border-radius: 13px; border: 1px dashed #28313f; display: grid; place-items: center; color: #66748a; font-size: 13px">Nothing played yet</div>
      <span class="grow"></span>
    </aside>
  </div>

  <footer class="hints">
    <span>Point at a card:</span>
    <span><kbd>T</kbd>tap</span><span><kbd>Space</kbd>flip</span><span><kbd>G</kbd>graveyard</span><span><kbd>F</kbd>focus</span>
    <i class="sep"></i>
    <span><kbd>S</kbd>select / pan</span><span><kbd>U</kbd>untap all</span><span><kbd>⌘Z</kbd>undo</span><span><kbd>?</kbd>all shortcuts</span>
    <span class="status"><i class="led"></i>Saved</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { inte: false }; }
  renderVals() {
    return {
      ar: !this.state.inte,
      inte: this.state.inte,
      nej: () => this.setState({ inte: true }),
      ja: () => this.setState({ inte: false })
    };
  }
}
</script>
</body>
</html>
