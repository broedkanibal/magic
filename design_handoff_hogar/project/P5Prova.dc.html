<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2 · Click the library: Not my library</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./mesa.css">
<link rel="stylesheet" href="./hogar.css">
<link rel="stylesheet" href="./hogar2.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0d1015}
a{color:#6b8cff}a:hover{color:#8ea6ff}
</style>
</helmet>
<div class="ab crop2" style="width: 1061px; height: 722px">
  <section class="matta" style="position: absolute; left: 10px; top: 10px; width: 1041px; height: 702px">
    <sc-if value="{{ar}}" hint-placeholder-val="{{ true }}">
    <div class="start sek" style="top: 200px"><h2>Play your first card when you're ready</h2></div>
      <button class="st lib" style="left: 560px; top: 440px; padding: 0; border: 0; background: none; cursor: pointer" onClick="{{oppna}}" aria-label="Library, 33 cards. Open the menu">
        <span class="slv"></span>
        <span class="hc bla"><i></i>Library<b>33</b></span>
      </button>
      <sc-if value="{{meny}}" hint-placeholder-val="{{ false }}">
        <div class="vmeny" style="left: 500px; top: 300px">
          <span class="rub">Library</span>
          <button class="ign" onClick="{{nej}}"><i></i><span><b>Not my library</b><em>It's a face-down card</em></span></button>
        </div>
      </sc-if>
    </sc-if>
    <sc-if value="{{inte}}" hint-placeholder-val="{{ false }}">
    <div class="start">
      <span class="lekill"><span class="ring"></span><span class="slv"></span></span>
      <h2>Put your library on the table</h2>
      <p>Mesa uses it to learn how your cards lie</p>
    </div>
      <div class="card" style="left: 560px; top: 440px"><span class="slv" role="img" aria-label="A face-down card"></span></div>
      <span class="hc mening" style="left: 625px; top: 612px"><span>Face-down card</span><i class="kvsep"></i><button onClick="{{ja}}">It's my library</button></span>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1061,"height":722}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { inte: false, meny: false }; }
  renderVals() {
    return { ar: !this.state.inte, inte: this.state.inte, meny: this.state.meny,
      oppna: () => this.setState({ meny: !this.state.meny }),
      nej: () => this.setState({ inte: true, meny: false }),
      ja: () => this.setState({ inte: false }) };
  }
}
</script>
</body>
</html>
