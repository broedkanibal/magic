<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your sleeves, on the deck page</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./mesa.css">
<link rel="stylesheet" href="./hogar2.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0d1015}
a{color:#6b8cff}a:hover{color:#8ea6ff}
</style>
</helmet>
<div class="ab" style="width: 720px; height: 420px">
  <section class="svpanel">
    <h3>Sleeves</h3>
    <p>Your library and face-down cards show in these sleeves. Everyone at the table sees them, just like at a real table.</p>
    <div class="svrad">
      <button class="svval vald" aria-pressed="true">
        <span class="mini"><span class="slv"></span><span class="kam"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg></span></span>
        From the camera
      </button>
      <button class="svval" aria-pressed="false"><span class="mini"><span class="slv" style="--s1: #2b2f36; --s2: #0e1014; --s3: #6a748455"></span></span>Black</button>
      <button class="svval" aria-pressed="false"><span class="mini"><span class="slv"></span></span>Green</button>
      <button class="svval" aria-pressed="false"><span class="mini"><span class="slv" style="--s1: #2f5fb8; --s2: #142a5c; --s3: #6f9bff55"></span></span>Blue</button>
      <button class="svval" aria-pressed="false"><span class="mini"><span class="slv" style="--s1: #6a3fa8; --s2: #2e1752; --s3: #b58cff55"></span></span>Purple</button>
      <button class="svval" aria-pressed="false"><span class="mini"><span class="slv" style="--s1: #a8343a; --s2: #4d1216; --s3: #ff8a8a55"></span></span>Red</button>
      <button class="svval" aria-pressed="false"><span class="mini"><img src="img/baksida.jpg" alt=""></span>No sleeves</button>
    </div>
    <div class="svnot">Mesa takes the color from your library the first time it lies on the table.</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":420}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
